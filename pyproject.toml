[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptvedit"
version = "0.1.0"
description = "スクリプト（Python DSL）から ffmpeg で動画を組み立てるビデオエディタ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kojima8924" }]
# コア（Project/Object/Effect/ffmpeg 呼び出し）は標準ライブラリのみで動作する。
# 追加機能は extras で導入する。
dependencies = []

[project.optional-dependencies]
# morph_to / explode_to / assemble_from / fly_to（モーフィング・パーティクル）
morph = ["numpy", "scipy", "opencv-python", "Pillow>=9.1", "tqdm"]
# 図解アニメ（framekit とその上の regex_view / slots / text_transition / odometer /
# flow_graph / flow_tree / globe）。framekit.need() の案内と揃える
figures = ["numpy", "opencv-python", "Pillow>=9.1"]
# web Object / slide / テンプレート / formula（HTML レンダリング。KaTeX は同梱）
web = ["playwright"]
# ビート検出（beat_sync）
beat = ["numpy", "scipy"]
# TTS（voice / narrate）の edge バックエンド。
# VOICEVOX バックエンドは追加依存なし（別プロセスのエンジンを HTTP で呼ぶ）、
# sapi バックエンド（Windows 標準音声）も追加依存なし。
tts = ["edge-tts"]
# 進捗表示・検証ツール（testkit はフレーム比較に Pillow を使う）
# Pillow の下限 9.1 は text_image()（ImageFont.Layout）の要件。textimage.py の
# _PIL_MIN_VERSION と揃える。
tools = ["tqdm", "numpy", "opencv-python", "Pillow>=9.1"]
all = ["numpy", "scipy", "opencv-python", "Pillow>=9.1", "playwright", "tqdm", "edge-tts"]
# 開発用（テスト・カバレッジ・ビルド）。fonttools はテスト用の自作フォント
# tests/golden/textmove/svtm_block.ttf を作り直すとき（make_font.py）だけ使う
dev = ["pytest", "pytest-cov", "build", "pyflakes", "fonttools"]

[project.scripts]
scriptvedit = "scriptvedit.cli:_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# formula() 用の同梱 KaTeX（CDN を使わずオフラインで数式をレンダするため vendor/ ごと配布する）
scriptvedit = [
    "templates/*.html",
    "templates/vendor/katex/*.css",
    "templates/vendor/katex/*.js",
    "templates/vendor/katex/*.md",
    "templates/vendor/katex/fonts/*.woff2",
    # globe() の陸地の既定（Natural Earth 1:110m の陸のマスク。パブリックドメイン）と、
    # その出典・利用条件（同梱の素材・データの「全部自作」の唯一の例外。data/NOTICE.md）
    "data/*.png",
    "data/NOTICE.md",
]
