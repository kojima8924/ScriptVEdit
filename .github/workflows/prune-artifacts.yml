name: Prune obsolete ScriptVEdit CI artifacts

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - ".github/workflows/prune-artifacts.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without changing stored artifacts
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: scriptvedit-artifact-pruning
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.repository == 'kojima8924/ScriptVEdit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve latest successful CI, prune obsolete dist and previews
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "kojima8924/ScriptVEdit":
              raise RuntimeError("Unexpected repository " + repo)
          dry = os.environ.get("DRY_RUN", "true").lower() == "true"
          base = "https://api.github.com/repos/" + repo

          def api(path, method="GET"):
              request = urllib.request.Request(
                  base + path, method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "scriptvedit-artifact-pruner",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if method == "DELETE":
                      if response.status != 204:
                          raise RuntimeError("Unexpected DELETE status")
                      return {}
                  return json.load(response)

          def all_pages(path, key):
              rows = []
              for page in range(1, 30):
                  answer = api(path + f"?per_page=100&page={page}")
                  batch = answer.get(key)
                  if not isinstance(batch, list):
                      raise RuntimeError("Missing API results: " + key)
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
              raise RuntimeError("Pagination truncated, refusing cleanup")

          runs = all_pages("/actions/workflows/ci.yml/runs", "workflow_runs")
          runs_by_id = {int(r["id"]): r for r in runs}
          successful_master = sorted(
              (r for r in runs
               if r.get("head_branch") == "master"
               and r.get("status") == "completed"
               and r.get("conclusion") == "success"),
              key=lambda r: r.get("created_at", ""), reverse=True,
          )
          if not successful_master:
              raise RuntimeError("No successful master CI, refusing cleanup")
          keep_run = int(successful_master[0]["id"])
          artifacts = all_pages("/actions/artifacts", "artifacts")
          now = datetime.now(timezone.utc)
          deletion_candidates = []
          for artifact in artifacts:
              if artifact.get("expired") or artifact.get("name") not in (
                  "dist", "blender-puppet-review"
              ):
                  continue
              run_id = (artifact.get("workflow_run") or {}).get("id")
              if run_id is None or int(run_id) not in runs_by_id:
                  continue
              run_id = int(run_id)
              run = runs_by_id[run_id]
              created = datetime.fromisoformat(
                  artifact["created_at"].replace("Z", "+00:00")
              )
              if run_id == keep_run or run.get("status") != "completed":
                  continue
              if created > now - timedelta(minutes=20):
                  continue
              if (run.get("conclusion") != "success"
                      and created > now - timedelta(hours=48)):
                  continue
              deletion_candidates.append(artifact)
          if len(deletion_candidates) > 200:
              raise RuntimeError("Too many deletions; refusing cleanup")
          bytes_total = sum(int(a["size_in_bytes"]) for a in deletion_candidates)
          print(json.dumps({
              "dry_run": dry,
              "protected_master_run": keep_run,
              "delete_count": len(deletion_candidates),
              "delete_bytes": bytes_total,
          }, indent=2))
          for artifact in deletion_candidates:
              print(("WOULD DELETE" if dry else "DELETE"),
                    artifact["id"], artifact["name"],
                    artifact["workflow_run"]["id"], flush=True)
              if not dry:
                  api("/actions/artifacts/" + str(artifact["id"]), "DELETE")
          PY
