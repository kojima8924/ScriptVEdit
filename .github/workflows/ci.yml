# CI: テスト(Windows/Linux × Python 3.10/3.13) + wheel ビルド + extras 単独インストール検証
# gitignore対象の大容量素材・edge-tts・VOICEVOX が無い環境では依存テストが
# pytest.skip される(許可リスト外の想定外skipは検知して失敗させる)。
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # 日本語の進捗出力・マニフェストをロケール非依存で扱う
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 改行規約の検証
        # .gitattributes(自前text=CRLF固定)に対しリポジトリが正規化済みであること。
        # 内容ハッシュ指紋がclone環境の改行差でずれない前提を守る(監査 issue #17)
        shell: bash
        run: git add --renormalize . && git diff --cached --stat --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # --- FFmpeg のピン留め方針 -------------------------------------------
      # 両 OS とも BtbN の同一日付リリースの FFmpeg 8 系ビルドへ SHA-256 検証つきで固定する。
      #   - apt の ffmpeg は 6.x で FFmpeg 8 の -/filter_complex 構文を知らない
      #   - setup-ffmpeg 系 action は「最新」を入れるため 9.x へ勝手に進む(2026-08 に実際に発生)
      #   - BtbN の autobuild リリースは一定期間で削除される。ダウンロードが 404 に
      #     なったらピンの寿命なので、次のコマンドで現行リリースの URL と SHA を取得して
      #     この2ステップを書き換えること(監査 issue #17 の方針):
      #       gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=3" \
      #         --jq '.[] | {tag: .tag_name, assets: [.assets[] | select(.name | contains("gpl-8")) | {name, digest}]}'
      # ---------------------------------------------------------------------
      - name: FFmpeg を導入 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-15-13-02/ffmpeg-n8.1.2-44-g7c533d0f86-win64-gpl-8.1.zip"
          $ffSha = "0e7829b6e1ba867e37bbad17153de258bd3bffaa3b745626a6424df0ea113970"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\ffmpeg.zip" $ffUrl
          $actual = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $ffSha) { Write-Error "SHA-256 不一致: $actual"; exit 1 }
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffdist"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffdist" -Directory | Select-Object -First 1).FullName + "\bin"
          Add-Content $env:GITHUB_PATH $bin
      - name: FFmpeg と日本語フォントを導入 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          FF_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-15-13-02/ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz"
          FF_SHA256="01f4a27f58acbea7c484232a62a7381f716ddf000e8f311b791f8bfc7c8912aa"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FF_URL"
          echo "$FF_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffdist && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffdist --strip-components=1
          sudo cp /tmp/ffdist/bin/ffmpeg /tmp/ffdist/bin/ffprobe /usr/local/bin/
      - name: FFmpeg のメジャーバージョンを検証 (8系必須)
        shell: bash
        run: |
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -Eq "ffmpeg version n?8\." \
            || { echo "FFmpeg 8 系ではありません"; exit 1; }
      - name: 依存をインストール
        run: python -m pip install -e .[all,dev]
      - name: Chromium を導入 (Linux)
        # formula() / web Object の実ブラウザ生成テストを実行するため
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: 未使用 import の検出
        # 単一ファイルから分割した経緯でstdlib importの残骸が溜まりやすい。
        # 再発すると読み手が依存関係を誤読するため、CIで止める
        # (__init__.py の再エクスポートと # noqa 付きは除外)
        run: python scripts/check_unused_imports.py
      - name: テスト実行(カバレッジ付き)
        run: python -m pytest tests/ -q -rs --cov=scriptvedit --cov-report=term --cov-fail-under=60 2>&1 | tee pytest.log
        shell: bash
      - name: 想定外の skip を検知
        # 許可された理由(gitignore対象の大容量素材・edge-tts・VOICEVOX・
        # Windows での Chromium/Pillow 未導入)以外の skip は失敗にする
        shell: bash
        run: |
          python - <<'EOF'
          import re, sys
          log = open("pytest.log", encoding="utf-8", errors="replace").read()
          allowed = [
              r"素材 .* が無い環境", r"ffmpeg", r"ffprobe", r"edge-tts",
              r"VOICEVOX", r"Chromium", r"chromium", r"Playwright",
              r"playwright", r"Pillow", r"scipy", r"numpy", r"フォント",
              r"再生成しました",
          ]
          bad = []
          for line in log.splitlines():
              m = re.match(r"SKIPPED \[\d+\] .*?: (.*)", line.strip())
              if m and not any(re.search(p, m.group(1)) for p in allowed):
                  bad.append(line.strip())
          if bad:
              print("想定外の skip:")
              print("\n".join(bad))
              sys.exit(1)
          print("skip はすべて許可リスト内")
          EOF

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: wheel をビルド
        run: |
          python -m pip install build
          python -m build
      - name: wheel のインストールと import スモーク
        run: |
          python -m pip install dist/*.whl
          python -c "import scriptvedit; print('import OK:', scriptvedit.MANIFEST_VERSION)"
          python -m scriptvedit describe --name fade > /dev/null
      - name: 各 extra の単独クリーンインストール検証
        # extra を1つだけ入れて対応モジュールが import できること(issue #13 P1-5 の回帰防止)
        run: |
          set -e
          WHEEL=$(ls dist/*.whl)
          declare -A MODS=( [morph]=scriptvedit.morph [beat]=scriptvedit.beat [tools]=scriptvedit.testkit [web]=scriptvedit.web [tts]=scriptvedit.tts )
          for ex in morph beat tools web tts; do
            python -m venv "/tmp/venv_$ex"
            "/tmp/venv_$ex/bin/pip" install --quiet "${WHEEL}[$ex]"
            "/tmp/venv_$ex/bin/python" -c "import importlib; importlib.import_module('${MODS[$ex]}'); print('$ex OK')"
          done
      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
